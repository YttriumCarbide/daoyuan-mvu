  const relList = document.createElement("link").relList;
  if (relList && relList.supports && relList.supports("modulepreload")) {
    return;
  }
  for (const link of document.querySelectorAll('link[rel="modulepreload"]')) {
    processPreload(link);
  }
  new MutationObserver((mutations) => {
    for (const mutation of mutations) {
      if (mutation.type !== "childList") {
        continue;
      }
      for (const node of mutation.addedNodes) {
        if (node.tagName === "LINK" && node.rel === "modulepreload")
          processPreload(node);
      }
    }
  }).observe(document, { childList: true, subtree: true });
  function getFetchOpts(link) {
    const fetchOpts = {};
    if (link.integrity) fetchOpts.integrity = link.integrity;
    if (link.referrerPolicy) fetchOpts.referrerPolicy = link.referrerPolicy;
    if (link.crossOrigin === "use-credentials")
      fetchOpts.credentials = "include";
    else if (link.crossOrigin === "anonymous") fetchOpts.credentials = "omit";
    else fetchOpts.credentials = "same-origin";
    return fetchOpts;
  }
  function processPreload(link) {
    if (link.ep)
      return;
    link.ep = true;
    const fetchOpts = getFetchOpts(link);
    fetch(link.href, fetchOpts);
  }

function switchTab(event2, tabId) {
  const button = event2.currentTarget;
  const panel = button.closest(".main-panel");
  if (!panel) return;
  panel.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
  panel.querySelectorAll(".tab-content").forEach((p2) => p2.style.display = "none");
  const tabToShow = document.getElementById("tab-" + tabId);
  if (tabToShow) {
    tabToShow.style.display = tabId === "messages" ? "flex" : "block";
  }
  button.classList.add("active");
}
function initTabNavigation(root = document) {
  root.querySelectorAll(".tab-btn[data-tab-id]").forEach((button) => {
    button.addEventListener("click", (event2) => {
      switchTab(event2, button.dataset.tabId);
    });
  });
}
window.drawMap = function(loreData, containerId) {
  const mapContainer = document.getElementById(containerId);
  if (!mapContainer) return;
  const connections = [
    ["center", "north"],
    ["center", "south"],
    ["center", "east"],
    ["center", "west"]
  ];
  if (loreData["special_east"]) {
    connections.push(["east", "special_east"]);
  }
  if (loreData["s_youlin"]) {
    connections.push(["south", "s_youlin"]);
    connections.push(["west", "s_gengjin"]);
    connections.push(["north", "s_liuli"]);
    connections.push(["center", "s_wuxing"]);
    connections.push(["west", "s_shahai"]);
    connections.push(["east", "s_yunsheng"]);
    connections.push(["south", "s_huangquan"]);
    connections.push(["north", "s_tianyuan"]);
  }
  connections.forEach(([k1, k2]) => {
    if (!loreData[k1] || !loreData[k2]) return;
    const n1 = loreData[k1];
    const n2 = loreData[k2];
    const line = document.createElement("div");
    line.className = "map-line";
    const dx = n2.x - n1.x;
    const dy = (n2.y - n1.y) * 0.75;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    line.style.width = `calc(${dist}% - 10px)`;
    line.style.left = `${n1.x}%`;
    line.style.top = `${n1.y}%`;
    line.style.transform = `rotate(${angle}deg)`;
    mapContainer.appendChild(line);
  });
  Object.entries(loreData).forEach(([key, data]) => {
    const node = document.createElement("div");
    let nodeClass = "map-node";
    if (key === "center") nodeClass += " node-center";
    else if (key === "north") nodeClass += " node-north";
    else if (key === "south") nodeClass += " node-south";
    else if (key === "east") nodeClass += " node-east";
    else if (key === "west") nodeClass += " node-west";
    else {
      nodeClass += " node-special";
      if (key === "s_tianyuan" || key === "special_east") nodeClass += " label-right";
    }
    node.className = nodeClass;
    node.style.left = `${data.x}%`;
    node.style.top = `${data.y}%`;
    node.innerHTML = `<div class="map-node-label">${data.name}</div>`;
    node.onclick = () => {
      document.querySelectorAll(`.map-node`).forEach((n) => n.classList.remove("active-node"));
      node.classList.add("active-node");
      window.showLocationDetails(data);
    };
    mapContainer.appendChild(node);
  });
};

async function deleteStatEntry(dataPath, cardElement) {

    const messages = window.getChatMessages("0-" + lastMsgId, { role: "assistant" });
    if (!messages || messages.length === 0) return;
    const targetMsgId = messages[messages.length - 1].message_id;
    if (window.Mvu && typeof window.Mvu.replaceMvuData === "function") {
      const fullData = window.Mvu.getMvuData({
        type: "message",
        message_id: targetMsgId
      });
      if (fullData && fullData.stat_data) {
        _.unset(fullData.stat_data, dataPath);
        await window.Mvu.replaceMvuData(fullData, {
          type: "message",
          message_id: targetMsgId
        });
        await window.notifyDaoyuanMvuChanged(fullData);
      }
    }
  } catch (err) {
    console.error("[道渊状态栏] 删除失败:", dataPath, err);

  }
}

  else if (btn.dataset.item) jPath = ["主角", "储物袋", btn.dataset.item];
  else if (btn.dataset.artifact) jPath = ["主角", "器物", btn.dataset.artifact];
  else if (btn.dataset.luck) jPath = ["主角", "气运", btn.dataset.luck];

    card.classList.remove("discard-confirm");
    card.classList.add("discarding");

    if (btn.dataset.npc) dataPath = ["人物", btn.dataset.npc];
    else if (btn.dataset.partner) dataPath = ["道侣", btn.dataset.partner];
    else if (btn.dataset.pet) dataPath = ["灵宠", btn.dataset.pet];
    else if (btn.dataset.skill) dataPath = ["主角", "功法", btn.dataset.skill];

  --text-main: #f1f2f6;

  --rare-text: #d980fa;
  --glass-border: 1px solid rgba(255, 255, 255, 0.1);
}
body {
  margin: 0;
  padding: 10px 0;
  background-color: transparent;
  font-family: "Noto Serif SC", serif;
  color: var(--text-main);
  font-size: 14px;
}
.terminal-container {
  width: 100%;
  max-width: 800px;
  margin: auto;
  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(30, 40, 50, 0.95),
      rgba(10, 15, 20, 0.98)
    ),
    url(https://www.transparenttextures.com/patterns/dark-matter.png);
  border: 1px solid #333;
  border-top: 2px solid var(--border-metal);
  border-bottom: 2px solid var(--border-metal);
  border-radius: 12px;
  box-shadow:
    0 0 40px rgba(0, 0, 0, 0.8),
    inset 0 0 60px rgba(0, 0, 0, 0.7),
    0 0 15px rgba(90, 61, 61, 0.3);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(5px);
}
.top-bar {
  height: 3px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--accent-blood),
    var(--accent-gold),
    var(--accent-mana),
    transparent
  );
  box-shadow: 0 0 15px var(--accent-gold-glow);
  animation: shimmer 3s infinite linear;
  background-size: 200% 100%;
}
.header {
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  background: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0.6),
    rgba(0, 0, 0, 0.2)
  );
  position: relative;
}
.guild-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}
.guild-logo {
  width: 36px;
  height: 36px;
  border: 2px solid var(--accent-gold);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
  color: var(--accent-gold);
  background: rgba(0, 0, 0, 0.5);
  box-shadow: 0 0 10px var(--accent-gold-glow);
  text-shadow: 0 0 5px var(--accent-gold);
  cursor: pointer;
  transition:
    transform 0.2s,
    box-shadow 0.2s;
  animation: btn-breathe 3s infinite ease-in-out;
}
@keyframes btn-breathe {
  0%,
  100% {
    transform: scale(1);
    box-shadow: 0 0 10px var(--accent-gold-glow);
  }
  50% {
    transform: scale(1.06);
    box-shadow: 0 0 18px var(--accent-gold);
  }
}
.guild-logo:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px var(--accent-gold);
}
.guild-name {
  font-size: 1.2em;
  letter-spacing: 2px;
  font-weight: 700;
  background: linear-gradient(to bottom, #fff, #bbb);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}
.time-display {
  font-size: 0.9em;
  color: var(--accent-gold);
  text-shadow: 0 0 5px var(--accent-gold-glow);
  font-family: "JetBrains Mono", monospace;
  border: 1px solid rgba(255, 215, 0, 0.3);
  padding: 2px 8px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.3);
}
/* 个人信息下拉面板样式 */
.hero-info-dropdown {
  display: none;
  position: absolute;
  top: 60px;
  left: 20px;
  background: linear-gradient(
    145deg,
    rgba(25, 20, 30, 0.95),
    rgba(15, 10, 15, 0.98)
  );
  border: 1px solid var(--accent-gold);
  border-radius: 8px;
  padding: 15px;
  box-shadow:
    0 5px 20px rgba(0, 0, 0, 0.8),
    inset 0 0 10px rgba(255, 215, 0, 0.1);
  z-index: 1000;
  min-width: 220px;
  animation: fadeIn 0.2s ease;
  backdrop-filter: blur(5px);
}
.hero-info-dropdown.show {
  display: block;
}
.hero-info-dropdown .stat-row {
  margin-bottom: 8px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
  padding-bottom: 6px;
}
.hero-info-dropdown .stat-row:last-child {
  margin-bottom: 0;
  border-bottom: none;
  padding-bottom: 0;
}
.content-grid {
  display: grid;
  grid-template-columns: 32% 1fr;
  gap: 0;
  background-color: transparent;
  flex-grow: 1;
}
.status-panel {
  background-color: rgba(20, 18, 22, 0.6);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  align-items: center;
  box-shadow: inset -5px 0 15px rgba(0, 0, 0, 0.3);
}
.status-panel.near-death {
  position: relative;
}
.status-panel.near-death::after {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 10;
  animation: bloodyPulse 1.5s ease-in-out infinite alternate;
  border-radius: inherit;
}
@keyframes bloodyPulse {
  0% { box-shadow: inset 0 0 5px rgba(220, 20, 60, 0.1), inset 0 0 2px rgba(255, 0, 0, 0.1); }
  100% { box-shadow: inset 0 0 20px rgba(220, 20, 60, 0.3), inset 0 0 8px rgba(255, 0, 0, 0.4); }
}
.avatar-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  margin-bottom: 10px;
}
.avatar-frame {
  width: 100px;
  height: 100px;
  border: 2px solid var(--accent-gold);
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 15px var(--accent-gold-glow),
    inset 0 0 10px rgba(0, 0, 0, 0.8);
  background-color: #000;
  transform: rotate(0deg);
  transition: transform 0.3s;
}
.avatar-frame::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent,
    rgba(255, 215, 0, 0.1),
    transparent
  );
  animation: shine-rotate 6s infinite linear;
  pointer-events: none;
  z-index: 2;
}
.user_avatar {
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  filter: sepia(10%) contrast(110%);
  transition: transform 0.5s;
}
.avatar-frame:hover .user_avatar {
  transform: scale(1.1);
}
.rank-tag {
  background: linear-gradient(135deg, #b8860b, #ffd700, #b8860b);
  color: #1a0f0f;
  padding: 4px 12px;
  font-size: 0.85em;
  border-radius: 4px;
  font-weight: 800;
  margin-top: -12px;
  z-index: 3;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.4);
  letter-spacing: 1px;
  min-width: 60px;
  text-align: center;
}
.stat-group {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stat-row {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.stat-label {
  font-size: 0.8em;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.progress-bg {
  width: 100%;
  height: 8px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
  position: relative;
}
.progress-fill {
  height: 100%;
  width: 0%;
  transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  position: relative;
  border-radius: 5px;
}
.fill-hp {
  background: linear-gradient(90deg, #c0392b, #e74c3c);
  box-shadow: 0 0 5px var(--accent-blood-glow);
}
.fill-mp {
  background: linear-gradient(90deg, #2980b9, #3498db);
  box-shadow: 0 0 5px var(--accent-mana-glow);
}
.fill-san {
  background: linear-gradient(90deg, #27ae60, #2ecc71);
  box-shadow: 0 0 5px rgba(46, 204, 113, 0.4);
}
.fill-exp {
  background: linear-gradient(90deg, #d35400, #f39c12);
  box-shadow: 0 0 5px rgba(243, 156, 18, 0.4);
}
.fill-daoxin {
  background: linear-gradient(90deg, #9b59b6, #d980fa);
  box-shadow: 0 0 5px rgba(217, 128, 250, 0.4);
}
.main-panel {
  background-color: transparent;
  display: flex;
  flex-direction: column;
  position: relative;
  min-height: 0;
}
.nav-tabs {
  display: flex;
  flex-wrap: wrap;
  background-color: rgba(0, 0, 0, 0.4);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  padding: 0 5px;
}
.tab-btn {
  flex: 1 1 18%;
  padding: 12px 2px;
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-family: inherit;
  font-size: 0.9em;
  font-weight: bold;
  transition: all 0.3s;
  position: relative;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
}
.tab-btn:hover {
  color: var(--text-main);
  background: linear-gradient(to top, rgba(255, 255, 255, 0.05), transparent);
}
.tab-btn.active {
  color: var(--accent-gold);
  text-shadow: 0 0 8px var(--accent-gold-glow);
}
.tab-btn::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  right: 50%;
  height: 2px;
  background: var(--accent-gold);
  box-shadow: 0 0 8px var(--accent-gold);
  transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  opacity: 0;
}
.tab-btn.active::after {
  left: 15%;
  right: 15%;
  opacity: 1;
}
.tab-content {
  padding: 20px;
  flex-grow: 1;
  overflow-y: auto;
  max-height: 480px;
  scrollbar-width: thin;
  scrollbar-color: var(--border-metal) rgba(0, 0, 0, 0.3);
}
.tab-content::-webkit-scrollbar {
  width: 6px;
}
.tab-content::-webkit-scrollbar-track {
  background: rgba(0, 0, 0, 0.3);
}
.tab-content::-webkit-scrollbar-thumb {
  background: var(--border-metal);
  border-radius: 3px;
}
.tab-content > p {
  margin: 0;
  color: var(--text-dim);
  font-style: italic;
}
.info-card,
.partner-card,
.npc-card,
.skill-card,
.quest-item {
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: linear-gradient(
    145deg,
    rgba(30, 30, 35, 0.6),
    rgba(20, 20, 25, 0.8)
  );
  padding: 10px 12px;
  margin-bottom: 6px;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
  transition:
    transform 0.2s,
    box-shadow 0.2s,
    border-color 0.2s;
  position: relative;
  overflow: hidden;
}
.info-card:hover,
.partner-card:hover,
.npc-card:hover,
.skill-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
  border-color: rgba(255, 255, 255, 0.2);
}
.info-title {
  color: var(--accent-gold);
  font-size: 1.05em;
  margin-bottom: 10px;
  border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
  padding-bottom: 8px;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
}
.info-text {
  font-size: 0.9em;
  color: #dcdde1;
  line-height: 1.6;
}
.danger-text {
  color: var(--accent-blood);
  text-shadow: 0 0 3px rgba(217, 79, 79, 0.4);
}
.rare-text {
  color: var(--rare-text);
  text-shadow: 0 0 3px rgba(217, 128, 250, 0.4);
}
.quest-item {
  border-left: 3px solid var(--text-dim);
  padding-left: 15px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.03), transparent);
}
.quest-item:hover {
  border-left-color: var(--accent-gold);
  background: linear-gradient(90deg, rgba(255, 215, 0, 0.05), transparent);
}
.card-portrait {
  flex-shrink: 0;
  width: 80px;
  height: 100px;
  border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background-color: rgba(0, 0, 0, 0.5);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.8);
}
.card-portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.skill-card {
  display: flex;
  gap: 15px;
  align-items: flex-start;
}
.partner-card,
.npc-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.partner-info,
.npc-info,
.skill-info {
  flex-grow: 1;
}
.partner-header,
.npc-header,
.skill-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}
.partner-name,
.npc-name,
.skill-name {
  font-size: 1.15em;
  font-weight: bold;
  color: var(--text-main);
  text-shadow: 0 2px 2px rgba(0, 0, 0, 0.8);
}
.skill-name {
  color: var(--accent-gold);
}
.partner-species,
.npc-title,
.skill-type {
  font-size: 0.8em;
  color: var(--text-dim);
  margin-left: 8px;
  font-weight: normal;
}
.status-badge {
  font-size: 0.75em;
  padding: 2px 8px;
  border-radius: 4px;
  background-color: #333;
  border: 1px solid rgba(255, 255, 255, 0.1);
  white-space: normal;
  word-break: break-all;
  max-width: 50%;
  line-height: 1.3;
  text-align: center;
}
.card-stats-grid {
  display: grid;
  grid-template-columns: max-content 1fr;
  align-items: center;
  gap: 6px 10px;
  font-size: 0.85em;
  margin-top: 10px;
  background: rgba(40, 40, 45, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px 15px;
  border-radius: 8px;
  width: 100%;
  box-sizing: border-box;
}
.card-stats-grid .stat-label {
  color: var(--text-dim);
}
.card-stats-grid i {
  color: #999;
  font-style: italic;
  opacity: 0.8;
}
.npc-info,
.skill-info {
  flex-direction: column;
  gap: 8px;
}
.npc-description,
.skill-description {
  font-size: 0.85em;
  color: #b3b3b3;
  line-height: 1.5;
  margin-top: 5px;
}
.portrait-wrapper {
  width: 100%;
  margin-top: 5px;
}
.portrait-actions {
  --portrait-action-size: clamp(30px, 6vw, 36px);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-auto-columns: var(--portrait-action-size);
  grid-auto-flow: column;
  gap: 6px;
  align-items: stretch;
  padding: 2px 5px;
}
.portrait-toggle-btn {
  min-width: 0;
  background: linear-gradient(
    to right,
    transparent,
    rgba(255, 215, 0, 0.08),
    transparent
  );
  border: 1px dashed rgba(255, 215, 0, 0.3);
  color: var(--accent-gold);
  padding: 8px 0;
  text-align: center;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.9em;
  font-weight: bold;
  transition: all 0.3s;
  letter-spacing: 2px;
  min-height: var(--portrait-action-size);
  box-sizing: border-box;
}
.portrait-toggle-btn:hover {
  background: linear-gradient(to right, transparent, rgba(255, 215, 0, 0.15), transparent);
  box-shadow: 0 0 10px var(--accent-gold-glow);
}
.large-portrait {
  display: none;
  margin-top: 10px;
  width: 100%;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow:
    0 5px 15px rgba(0, 0, 0, 0.5),
    inset 0 0 20px rgba(0, 0, 0, 0.8);
  overflow: hidden;
  align-items: center;
  justify-content: center;
  background: rgba(5, 4, 6, 0.9);
}
.large-portrait.show {
  display: flex;
  animation: fadeIn 0.4s ease;
}
.large-portrait img {
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  cursor: zoom-in;
  transition: filter 0.3s;
}
.large-portrait img:hover {
  filter: brightness(1.1);
}
.fairy-container {
  position: absolute;
  bottom: 5px;
  right: 20px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  z-index: 100;
  animation: fairy-bob 4s infinite ease-in-out;
  pointer-events: none;
}
.fairy-avatar {
  width: 45px;
  height: 45px;
  background-size: cover;
  background-position: center;
  border-radius: 50%;
  cursor: pointer;
  pointer-events: auto;
  box-shadow:
    0 0 20px var(--accent-gold),
    0 0 30px var(--accent-mana);
  transition:
    transform 0.3s,
    filter 0.3s;
  border: 2px solid #fff;
  animation: fairy-glow 3s infinite ease-in-out;
}
@keyframes fairy-glow {
  0%,
  100% {
    box-shadow:
      0 0 15px var(--accent-gold),
      0 0 25px var(--accent-mana);
    filter: brightness(1);
  }
  50% {
    box-shadow:
      0 0 25px var(--accent-gold),
      0 0 40px #4da6ff;
    filter: brightness(1.15);
  }
}
.fairy-avatar:hover {
  transform: scale(1.15) rotate(5deg);
  filter: brightness(1.2);
}
.fairy-bubble {
  max-width: 240px;
  background: rgba(20, 15, 25, 0.95);
  border: 1px solid var(--accent-gold);
  padding: 15px;
  border-radius: 12px;
  border-bottom-right-radius: 2px;
  font-size: 0.9em;
  color: var(--text-main);
  box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
  position: relative;
  opacity: 0;
  transform: translateY(10px);
  transition:
    opacity 0.3s ease,
    transform 0.3s ease;
  backdrop-filter: blur(4px);
}
.image-modal-overlay {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0, 0, 0, 0.9);
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(5px);
}
.image-modal-content {
  margin: auto;
  display: block;
  max-width: 90%;
  max-height: 90vh;
  border-radius: 8px;
  box-shadow: 0 0 30px var(--accent-gold-glow);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-drag: none;
  transition: transform 0.1s ease-out;
}
.image-modal-content:active {
  cursor: grabbing;
  transition: none;
}
.image-modal-close {
  position: absolute;
  top: 15px;
  right: 35px;
  color: #f1f1f1;
  font-size: 40px;
  font-weight: bold;
  transition: 0.3s;
  cursor: pointer;
  z-index: 10000;
}
.image-modal-close:hover,
.image-modal-close:focus {
  color: #bbb;
  text-decoration: none;
}
.message-reply-container {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.reply-input {
  flex-grow: 1;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--accent-mana);
  border-radius: 6px;
  padding: 10px;
  color: var(--text-main);
  font-family: inherit;
  font-size: 0.9em;
  resize: none;
  overflow-y: auto;
  max-height: 120px;
  line-height: 1.5;
}
.reply-input:focus {
  outline: none;
  border-color: var(--accent-gold);
  box-shadow:
    inset 0 0 5px rgba(0, 0, 0, 0.5),
    0 0 8px rgba(255, 215, 0, 0.2);
}
.reply-input::placeholder {
  color: var(--text-dim);
  opacity: 0.7;
}
.reply-input::-webkit-scrollbar {
  width: 4px;
}
.reply-input::-webkit-scrollbar-thumb {
  background: var(--accent-mana);
  border-radius: 2px;
}
.reply-button {
  background: linear-gradient(135deg, var(--accent-mana), #3480db);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  height: 42px;
  white-space: nowrap;
  min-width: 140px;
  flex-shrink: 0;
  text-align: center;
}
.reply-button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 8px rgba(77, 166, 255, 0.3);
}
.reply-button:disabled {
  background: #555;
  cursor: not-allowed;
  opacity: 0.6;
}
.map-section-title {
  color: var(--accent-gold);
  text-align: center;
  margin: 25px 0 15px;
  font-size: 1.25em;
  letter-spacing: 3px;
  font-weight: 800;
  text-shadow:
    0 0 10px var(--accent-gold-glow),
    0 0 20px rgba(255, 215, 0, 0.2);
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(
      90deg,

.map-wrapper {
  width: 100%;
  height: 380px;
  position: relative;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(30, 35, 45, 0.7),
      rgba(5, 5, 8, 0.9)
    ),
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 39px,
      rgba(255, 255, 255, 0.03) 39px,
      rgba(255, 255, 255, 0.03) 40px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 39px,
      rgba(255, 255, 255, 0.03) 39px,
      rgba(255, 255, 255, 0.03) 40px
    );
  border: 1px solid var(--border-metal);
  border-radius: 12px;
  box-shadow:
    inset 0 0 40px rgba(0, 0, 0, 0.8),
    0 5px 15px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  user-select: none;
  margin-bottom: 25px;
  transition: box-shadow 0.3s ease;
}
.map-wrapper:hover {
  box-shadow:
    inset 0 0 60px rgba(0, 0, 0, 0.9),
    0 8px 25px rgba(0, 0, 0, 0.7);
}
.map-grid {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.map-node {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255, 255, 255, 0.8);
}
.map-node::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  opacity: 0.3;
  background: currentColor;
}
.map-node::after {
  content: "";
  position: absolute;
  width: 160%;
  height: 160%;
  border-radius: 50%;
  border: 1px dashed rgba(255, 255, 255, 0.3);
  pointer-events: none;
  opacity: 0.5;
}
.map-node:hover,
.map-node.active-node {
  transform: translate(-50%, -50%) scale(1.4);
  z-index: 25;
  border-color: #fff;
  box-shadow: 0 0 25px currentColor;
}
.map-node.active-node::after {
  border: 2px solid currentColor;
  border-style: dotted;
  opacity: 1;
}
.map-node-label {
  position: absolute;
  top: 30px;
  white-space: nowrap;
  font-size: 0.85em;
  text-shadow: 0 2px 4px #000;
  color: var(--text-main);
  pointer-events: none;
  transition: all 0.3s ease;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(20, 20, 25, 0.75);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  opacity: 0.85;
  transform: translateY(0);
}
.map-node:hover .map-node-label,
.map-node.active-node .map-node-label {
  opacity: 1;
  transform: translateY(3px) scale(1.1);
  background: rgba(20, 20, 25, 0.95);
  z-index: 30;
}
.node-center {

}
.node-center .map-node-label {
  border-color: rgba(255, 215, 0, 0.5);
  color: var(--accent-gold);
}
.node-east {

  color: var(--accent-san);
  box-shadow: 0 0 15px var(--accent-san);
}
.node-east .map-node-label {

}
.node-south {
  background: var(--accent-blood);
  color: var(--accent-blood);
  box-shadow: 0 0 15px var(--accent-blood);
}
.node-south .map-node-label {
  border-color: rgba(255, 77, 77, 0.5);
  color: var(--accent-blood);
}
.node-west {

}
.node-west .map-node-label {

}
.node-north {
  background: var(--accent-mana);

  box-shadow: 0 0 15px var(--accent-mana);
}
.node-north .map-node-label {
  border-color: rgba(77, 166, 255, 0.5);

}

}

}
.map-line {

  pointer-events: none;

}

}

}
@keyframes bellShake {
  0% { transform: rotate(0); }
  15% { transform: rotate(10deg); }
  30% { transform: rotate(-10deg); }
  45% { transform: rotate(5deg); }
  60% { transform: rotate(-5deg); }
  75% { transform: rotate(2deg); }
  90% { transform: rotate(-2deg); }
  100% { transform: rotate(0); }
}
